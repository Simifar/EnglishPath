name: Content checks
on: [pull_request, push]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun test
      - run: bun run validate-content
      - run: bun run build
      - run: bun run check-bundle
      - run: bun run build:pages --base-path /preview --site-url https://example.github.io/preview/
      - run: bun run check:pages
